<div class="masthead">
  <div class="masthead__inner-wrap editorial-nav">
    <a class="site-title" href="{{ '/' | relative_url }}">Ganesh Raman<span>Life, learnings & realities</span></a>
    <nav id="site-nav" aria-label="Primary navigation">
      <ul class="desktop-nav">{% for link in site.data.navigation.main %}<li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>{% endfor %}</ul>
      <details class="mobile-nav"><summary>Menu</summary><ul>{% for link in site.data.navigation.main %}<li><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>{% endfor %}<li><a href="{{ '/posts/' | relative_url }}">Archive</a></li></ul></details>
    </nav>
  </div>
</div>
